<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heatmap S&amp;P 500</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    tv-heatmap { display: block; width: 100%; height: 100vh; }
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-heatmap.js"></script>
</head>
<body>
  <tv-heatmap
    heatmap-type="stock"
    data-source="SPX500"
    grouping="sector"
    block-size="market_cap_basic"
    block-color="change">
  </tv-heatmap>
</body>
</html>
